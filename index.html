 "text": "2주 이상 지연 건", "link": null}, {"col": 2, "text": "방문 후 2주가 지나도 업로드하지 않은 경우 신속히 연락하여 업로드를 요청하고 예정일을 확인한다.", "link": null}], [{"col": 1, "text": "4주 초과 지연 건", "link": null}, {"col": 2, "text": "현재 4주를 초과한 인플루언서들은 메시지를 읽고도 답하지 않거나 연락이 끊긴 상태로, 대부분 회신이 없다. 업무 여유가 있을 때 추가 리마인드를 진행한다.", "link": null}], [{"col": 1, "text": "拾懿 원고료 미정산", "link": null}, {"col": 2, "text": "콘텐츠 업로드는 완료되었으나 수령 계좌 정보를 받지 못해 정산이 보류된 상태이다. 추후 다시 연락하여 계좌 정보를 수집한 후 비용 상신을 진행해야 한다.", "link": null}, {"col": 3, "text": "拾懿 계정: 샤오홍슈 프로필", "link": "https://www.xiaohongshu.com/user/profile/5ff08a27000000000100766c"}], [{"col": 1, "text": "후속 처리 내역 기록", "link": null}, {"col": 2, "text": "추가 연락 및 회신 내용, 업로드 여부, 정산 진행 상황은 기존 관리표에 반영한다.", "link": null}]]}]}, {"brand": "CHAAKAN", "sheets": [{"name": "인플루언서 모집·컨택", "rows": [[{"col": 1, "text": "구분", "link": null}, {"col": 2, "text": "업무 방법 및 기준", "link": null}, {"col": 3, "text": "관련 링크·유의사항", "link": null}], [{"col": 1, "text": "운영 채널", "link": null}, {"col": 2, "text": "인스타그램 및 샤오홍슈를 중심으로 인플루언서를 모집한다.", "link": null}], [{"col": 1, "text": "샤오홍슈 직접 검색", "link": null}, {"col": 2, "text": "패션·코디 관련 키워드를 중심으로 검색한다. 한국에서 인기 있는 브랜드명, 주요 상권명, 한국 여행·쇼핑 관련 키워드도 함께 검색하여 적합한 인플루언서를 찾는다.", "link": null}, {"col": 3, "text": "한국 거주자뿐 아니라 한국 쇼핑 정보 콘텐츠의 성과가 좋은 중국 거주 인플루언서도 검토한다.", "link": null}], [{"col": 1, "text": "샤오홍슈 모집 공고", "link": null}, {"col": 2, "text": "위챗 미니프로그램에 모집 공고를 게시하여 신청자를 모집한다. 공고에는 협업 조건을 간단히 기재하고, 표지에는 인기 제품을 활용하여 신청을 유도한다.", "link": null}, {"col": 3, "text": "직접 검색 대비 신청자는 많으나, 계정 적합도와 콘텐츠 품질의 편차가 있어 개별 검토가 필요하다.", "link": null}], [{"col": 1, "text": "모집 신청 항목", "link": null}, {"col": 2, "text": "샤오홍슈 닉네임, 계정 링크, 위챗 ID를 필수로 수집하며, 그 외 항목은 모집 목적에 따라 추가한다.", "link": null}, {"col": 3, "text": "모집 공고 등록 사이트 — PC 이용 가능, 위챗 로그인 필요", "link": "https://www.baominggongju.com/home"}], [{"col": 1, "text": "인스타그램 자동 DM", "link": null}, {"col": 2, "text": "현재 자동 DM을 통한 모집을 중심으로 운영하며, 직접 검색을 병행한다.", "link": null}], [{"col": 1, "text": "인스타그램 직접 검색", "link": null}, {"col": 2, "text": "패션·데일리룩·신발 코디 관련 키워드와 해시태그로 게시물 및 릴스를 검색한다. 주요 상권·매장의 위치 태그와 관련 브랜드의 태그된 게시물에서도 후보를 찾는다. 적합한 계정을 찾으면 유사 계정 및 함께 태그된 계정도 확인한다.", "link": null}, {"col": 3, "text": "계정의 콘텐츠 유형과 최근 성과를 확인한 뒤 DM으로 협업을 제안한다.", "link": null}], [{"col": 1, "text": "우수 성과 인플루언서 재컨택", "link": null}, {"col": 2, "text": "기존 우수 성과 인플루언서 리스트에서 성과가 좋았던 인플루언서를 선정하여 분기별 재협업을 검토한다.", "link": null}, {"col": 3, "text": "우수 성과 인플루언서 리스트 링크", "link": "https://docs.google.com/spreadsheets/d/1s7eBNe8Widsey7viD8hQ81zRiyNBIbcxbNLUFDQ3n30/edit?usp=sharing"}], [{"col": 1, "text": "계정 유형 선정 기준", "link": null}, {"col": 2, "text": "패션·코디 계정을 우선으로 선정한다. 한국 방문객의 정보 검색 수요를 고려하여 쇼핑 정보 및 여행 계정도 일부 검토한다.", "link": null}, {"col": 3, "text": "팔로워 수보다 계정 유형의 적합도와 실제 콘텐츠 성과를 우선 확인한다.", "link": null}], [{"col": 1, "text": "제품 제공 협업 선정 기준", "link": null}, {"col": 2, "text": "최근 동종 콘텐츠 10~15건의 평균 좋아요 수가 80개 이상인 계정을 우선 검토하며, 가능하면 평균 100개 이상인 계정을 선정한다.", "link": null}, {"col": 3, "text": "서로 다른 유형의 콘텐츠를 섞지 않고, 협업 예정 콘텐츠와 유사한 게시물을 기준으로 확인한다.", "link": null}], [{"col": 1, "text": "유료 협업 비용 협의", "link": null}, {"col": 2, "text": "CPV 5~10원 범위에서 협의하되, 기본적으로 5원 수준을 목표로 한다. 콘텐츠 및 계정의 우수성에 따라 상향 검토한다. 샤오홍슈는 저장당 단가 1,000원 미만, 인스타그램은 저장·공유 합산 건당 단가 약 500원을 목표로 협의한다.", "link": null}, {"col": 3, "text": "샤오홍슈 예상 조회수 = 평균 좋아요 수 × 50. 인스타그램은 실제 조회수를 기준으로 검토한다.", "link": null}], [{"col": 1, "text": "유료 협업 진행 판단", "link": null}, {"col": 2, "text": "위 기준 내에서 협의가 완료되면 진행한다. 기준을 초과하거나 진행 여부를 판단하기 어려운 우수 계정은 대표님께 추가 검토를 요청한다.", "link": null}, {"col": 3, "text": "협업 형식, 제품 제공 수량, 노출 시간 등 최종 협의 조건을 함께 전달한다.", "link": null}], [{"col": 1, "text": "협업 확정 후 정산 자료 안내", "link": null}, {"col": 2, "text": "유료 협업 확정 시 수령 계좌 국가를 확인하고, 필요한 정산 자료를 미리 안내하여 준비하도록 요청한다.", "link": null}, {"col": 3, "text": "자료 누락이나 계좌 정보 오류로 인한 지급 지연을 방지하기 위해 사전에 안내한다.", "link": null}], [{"col": 1, "text": "한국 계좌 수령 시", "link": null}, {"col": 2, "text": "외국인등록증 사진, 통장 사본, 수취인 및 계좌 정보를 요청한다.", "link": null}, {"col": 3, "text": "상세 제출 및 지급 절차는 ‘비용 지급’ 시트 참고 pe="col">코드</th></tr></thead><tbody>'+group.map(row=>'<tr>'+row.map(c=>'<td>'+cell(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue} if(r.length===1&&/^[78]\. /.test(a.text)){let end=k+1;while(end<rows.length&&!/^\d+\. /.test(rows[end][0].text))end++;const text=rows.slice(k+1,end).map(r=>r.map(c=>c.text).join(' / ')).join('\n');if(!q||(a.text+text).toLowerCase().includes(q)){html+=`<h4>${fmt(a.text)}</h4><div class="copybox"><button class="copy" data-text="${esc(text)}">문구 복사</button><pre>${fmt(text)}</pre></div>`;count++}k=end-1;continue}if(q&&!r.some(c=>c.text.toLowerCase().includes(q)))continue;if(r.length>1&&heads.includes(a.text)){continue}count++;if(r.length===1){html+=a.text.length<55&&!a.link?`<h4>${cell(a)}</h4>`:`<div class="single">${cell(a)}</div>`}else{html+=`<article class="card ${/기한|제한|미정산|미전달|지연|기본 제품|제공 조건|제공 기준|진행 판단/.test(a.text)?'priority':''}"><h3>${cell(a)}${/미정산|미전달|지연/.test(a.text)?'<span class="badge">후속 확인</span>':/제한|기한|제공 조건|제공 기준/.test(a.text)?'<span class="badge">중요</span>':''}</h3><p>${cell(r[1])}</p>${r.length>2?'<div class="note">'+r.slice(2).map(cell).join('<br>')+'</div>':''}</article>`}}return html?`<section class="section" id="s${i}"><h2><em>0${i+1}</em>${esc(s.name)}</h2>${html}</section>`:''}).join('');if(!count)document.querySelector('#sections').innerHTML='<div class="empty">검색 결과가 없습니다. 다른 키워드로 검색해 주세요.</div>';document.querySelectorAll('.copy').forEach(btn=>btn.onclick=async()=>{try{await navigator.clipboard.writeText(btn.dataset.text);btn.textContent='복사 완료';setTimeout(()=>btn.textContent='문구 복사',1800)}catch{btn.textContent='아래 문구를 선택해 복사해 주세요'}})}document.querySelectorAll('[data-brand]').forEach(x=>x.onclick=()=>{brand=x.dataset.brand;document.querySelector('#search').value='';draw();window.scrollTo(0,0)});document.querySelector('#search').oninput=draw;draw();
