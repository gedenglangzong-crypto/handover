 → 오늘의 환율 → 날짜 선택(인보이스 작성일자) → 조회하기": "환율조회 → 오늘의 환율 → 选择日期（Invoice制作日期）→ 조회하기", "입력 기준": "填写标准", "환율 조회일": "汇率查询日期", "인보이스 작성일자와 동일하게 설정": "设置为与Invoice制作日期相同", "일자 확인": "核对日期", "환율 조회일 = 회계처리일자 = 증빙일자": "汇率查询日期 = 会计处理日期 = 凭证日期", "환율 입력": "填写汇率", "소수점 둘째 자리까지 입력": "保留小数点后两位", "6. 결재상신": "6. 提交审批", "작성을 완료한 후 [결재상신] 버튼을 클릭한다.": "填写完成后点击「결재상신」按钮。", "순서": "顺序", "담당자": "负责人", "결재": "审批", "본인": "本人", "합의": "会签", "재무": "财务", "이광호 팀장님": "이광호팀장", "수신 및 참조: 이광호 팀장님, 이영남 대표이사님, 재무팀": "收件及抄送：이광호팀장、이영남代表理事、财务组", "상신 완료 후 **문서 최상단의 빈 입력란에 해당 인플루언서의 송금정보 텍스트를 입력하고 [등록]**한다.": "提报完成后，**在文件最上方的空白输入框填写该博主的汇款信息文本，并点击「등록」**。", "7. 해외 계좌 정산 자료 요청 문구": "7. 海外账户结算资料请求话术", "8. 한국 계좌 정산 자료 요청 문구": "8. 韩国账户结算资料请求话术", "현황 및 후속 업무": "现状与后续工作", "관련 자료": "相关资料", "업로드 지연 확인": "检查上传延迟", "관리 인원이 많지 않아 기존 관리표에서 지연 현황을 쉽게 확인할 수 있다. 초록색은 방문 후 2주가 지나도 미업로드된 건, 빨간색은 4주를 초과한 미업로드 건이다.": "管理人数较少，可直接在现有管理表查看延迟情况。绿色表示访问后超过2周仍未上传，红色表示超过4周未上传。", "약국 방문(샤오홍슈) ": "药局访问（小红书）", "2주 이상 지연 건": "延迟2周以上", "방문 후 2주가 지나도 업로드하지 않은 경우 신속히 연락하여 업로드를 요청하고 예정일을 확인한다.": "访问后超过2周仍未上传时，及时联系催稿，并确认预计上传日期。", "4주 초과 지연 건": "延迟超过4周", "현재 4주를 초과한 인플루언서들은 메시지를 읽고도 답하지 않거나 연락이 끊긴 상태로, 대부분 회신이 없다. 업무 여유가 있을 때 추가 리마인드를 진행한다.": "目前超过4周的博主均存在已读不回或失联情况，大多不会回复。有空时可再次提醒。", "拾懿 원고료 미정산": "拾懿稿费未结算", "콘텐츠 업로드는 완료되었으나 수령 계좌 정보를 받지 못해 정산이 보류된 상태이다. 추후 다시 연락하여 계좌 정보를 수집한 후 비용 상신을 진행해야 한다.": "内容已上传，但尚未收到收款账户信息，结算暂缓。后续需再次联系收集账户信息，再提交费用申请。", "拾懿 계정: 샤오홍슈 프로필": "拾懿账号：小红书主页", "후속 처리 내역 기록": "记录后续处理情况", "추가 연락 및 회신 내용, 업로드 여부, 정산 진행 상황은 기존 관리표에 반영한다.": "将追加联系、回复、上传与结算进度记录在现有管理表中。", "인스타그램 및 샤오홍슈를 중심으로 인플루언서를 모집한다.": "主要通过Instagram和小红书招募博主。", "샤오홍슈 직접 검색": "小红书自主检索", "패션·코디 관련 키워드를 중심으로 검색한다. 한국에서 인기 있는 브랜드명, 주요 상권명, 한국 여행·쇼핑 관련 키워드도 함께 검색하여 적합한 인플루언서를 찾는다.": "以时尚穿搭关键词为主，同时搜索韩国人气品牌、主要商圈、韩国旅游及购物关键词，寻找合适博主。", "한국 거주자뿐 아니라 한국 쇼핑 정보 콘텐츠의 성과가 좋은 중국 거주 인플루언서도 검토한다.": "除韩国居住者外，也可考虑韩国购物攻略表现良好的中国居住博主。", "샤오홍슈 모집 공고": "小红书招募公告", "위챗 미니프로그램에 모집 공고를 게시하여 신청자를 모집한다. 공고에는 협업 조건을 간단히 기재하고, 표지에는 인기 제품을 활용하여 신청을 유도한다.": "通过微信小程序发布公告招募。简要写明合作条件，封面使用人气产品吸引报名。", "직접 검색 대비 신청자는 많으나, 계정 적합도와 콘텐츠 품질의 편차가 있어 개별 검토가 필요하다.": "报名人数较自主检索多，但账号匹配度及内容质量差异较大，需逐一审核。", "샤오홍슈 닉네임, 계정 링크, 위챗 ID를 필수로 수집하며, 그 외 항목은 모집 목적에 따라 추가한다.": "必填信息为小红书昵称、账号链接及微信号，其他项目按招募目的添加。", "인스타그램 자동 DM": "Instagram自动私信", "현재 자동 DM을 통한 모집을 중심으로 운영하며, 직접 검색을 병행한다.": "目前主要通过自动DM招募，同时辅助自主检索。", "인스타그램 직접 검색": "Instagram自主检索", "패션·데일리룩·신발 코디 관련 키워드와 해시태그로 게시물 및 릴스를 검색한다. 주요 상권·매장의 위치 태그와 관련 브랜드의 태그된 게시물에서도 후보를 찾는다. 적합한 계정을 찾으면 유사 계정 및 함께 태그된 계정도 확인한다.": "通过时尚、日常穿搭、鞋子搭配关键词与话题标签搜索帖子和Reels，也可查看主要商圈及门店的位置标签、相关品牌的被标记帖子。找到合适账号后，继续查看相似账号及共同被标记的账号。", "계정의 콘텐츠 유형과 최근 성과를 확인한 뒤 DM으로 협업을 제안한다.": "确认账号内容类型与近期表现后，通过DM提出合作。", "우수 성과 인플루언서 재컨택": "再次联系优秀成果博主", "기존 우수 성과 인플루언서 리스트에서 성과가 좋았던 인플루언서를 선정하여 분기별 재협업을 검토한다.": "从现有优秀成果博主清单筛选表现较好的博主，按季度考虑再次合作。", "우수 성과 인플루언서 리스트 링크": "优秀成果博主清单链接", "계정 유형 선정 기준": "账号类型筛选标准", "패션·코디 계정을 우선으로 선정한다. 한국 방문객의 정보 검색 수요를 고려하여 쇼핑 정보 및 여행 계정도 일부 검토한다.": "优先选择时尚穿搭账号；考虑赴韩游客的信息搜索需求，也可适当选择购物攻略及旅游账号。", "팔로워 수보다 계정 유형의 적합도와 실제 콘텐츠 성과를 우선 확인한다.": "比起粉丝数，更优先考虑账号匹配度与实际内容表现。", "최근 동종 콘텐츠 10~15건의 평균 좋아요 수가 80개 이상인 계정을 우선 검토하며, 가능하면 평균 100개 이상인 계정을 선정한다.": "优先考虑近期10～15篇同类内容平均点赞80个以上的账号，尽量选择平均100个以上的账号。", "서로 다른 유형의 콘텐츠를 섞지 않고, 협업 예정 콘텐츠와 유사한 게시물을 기준으로 확인한다.": "不混合不同内容类型，以与本次合作相似的内容为评估基准。", "유료 협업 비용 협의": "付费合作费用协商", "CPV 5~10원 범위에서 협의하되, 기본적으로 5원 수준을 목표로 한다. 콘텐츠 및 계정의 우수성에 따라 상향 검토한다. 샤오홍슈는 저장당 단가 1,000원 미만, 인스타그램은 저장·공유 합산 건당 단가 약 500원을 목표로 협의한다.": "按CPV 5～10韩元协商，基本目标为5韩元左右，优秀内容及账号可上调。小红书每次收藏单价目标低于1,000韩元；Instagram收藏与分享合计单价目标约500韩元。", "샤오홍슈 예상 조회수 = 평균 좋아요 수 × 50. 인스타그램은 실제 조회수를 기준으로 검토한다.": "小红书预计浏览量 = 平均点赞数 × 50；Instagram以实际浏览量为准。", "유료 협업 진행 판단": "判断是否进行付费合作", "위 기준 내에서 협의가 완료되면 진행한다. 기준을 초과하거나 진행 여부를 판단하기 어려운 우수 계정은 대표님께 추가 검토를 요청한다.": "在标准内协商完成即可进行。超过标准或难以判断的优秀账号，提交代表进一步审核。", "협업 형식, 제품 제공 수량, 노출 시간 등 최종 협의 조건을 함께 전달한다.": "同时说明最终协商的内容形式、提供数量及曝光时长等条件。", "유료 협업 확정 시 수령 계좌 국가를 확인하고, 필요한 정산 자료를 미리 안내하여 준비하도록 요청한다.": "付费合作确定后，确认收款账户所属国家，提前通知所需结算资料，请对方准备。", "외국인등록증 사진, 통장 사본, 수취인 및 계좌 정보를 요청한다.": "索取外国人登录证照片、存折复印件、收款人及账户信息。", "상세 제출 및 지급 절차는 ‘비용 지급’ 시트 참고": "详细提交与付款流程见「费用支付」章节", "아래 해외 송금 정보 및 증빙자료를 요청한다.": "索取下方海外汇款信息与证明资料。", "방문 예약 진행": "安排访问预约", "협업 조건을 최종 확인한 후 방문 예약 절차를 진행한다.": "最终确认合作条件后，安排访问预约。", "‘방문 예약·제품 제공’ 시트 참고": "参考「访问预约与产品提供」相关内容", "은행카드 또는 계좌 정보가 확인되는 은행 자료 사본": "银行卡或可确认账户信息的银行资料复印件", "인플루언서 정보 기록": "记录博主信息", "선정 기준에 따라 협업 가치가 있다고 판단하여 컨택한 인플루언서는 모두 **인플루언서 리스트(중화권)**에 기록한다.": "按筛选标准判断有合作价值并已联系的博主，全部记录在**博主清单（中华圈）**中。", "【인플루언서 리스트(중화권) 링크】": "【博主清单（中华圈）链接】", "협업 조건 확인": "确认合作条件", "연락이 닿으면 유료·제품 제공 여부, 단독·모음집 등 콘텐츠 형식과 제공 수량을 협의한다. 방문 희망 매장도 함께 확인한다.": "取得联系后，协商付费或置换、单独或合集等内容形式及提供数量，并确认希望访问的门店。", "방문 가능 매장: 홍대·명동·성수": "可访问门店：弘大／明洞／圣水", "가이드라인 전달": "发送合作指南", "방문 매장 및 콘텐츠 형식에 맞는 BF(가이드라인)를 전달한다.": "按照访问门店与内容形式，发送对应BF（合作指南）。", "CN: 간체 / TW: 번체. 하단 링크 참고": "CN：简体／TW：繁体，见下方链接", "방문 예약·확인서 발급": "预约及发放访问确认书", "특별히 긴급한 경우를 제외하고 최소 방문 하루 전까지 예약하도록 안내한다. 일정 확정 후 캘린더에 기록하고 인플루언서에게 방문확인서를 발급한다.": "除特别紧急情况外，至少提前一天预约。时间确定后记入日历，并向博主发放访问确认书。", "기본 제품 제공 조건": "基本产品提供条件", "기본적으로 총 2켤레를 제공하며, 지정 제품 1켤레와 자유 선택 제품 1켤레로 구성한다.": "基本共提供2双，由指定款1双及自由选择款1双组成。", "제품 제공 조건 조정": "调整产品提供条件", "유료 협업 비용 협의 시 자유 선택 2켤레 또는 3켤레 제공 조건으로 조정하여 협의할 수 있다. 기존 방문자 중 콘텐츠 성과가 우수했던 인플루언서는 자유 선택 2켤레로 조정하기도 한다.": "付费合作议价时，可协商调整为自由选择2双或3双。曾合作且内容成果优秀的博主，有时也会调整为自由选择2双。", "최종 협의한 제공 조건을 방문확인서에 정확히 반영한다.": "将最终协商的提供条件准确写入访问确认书。", "롱부츠 선택 제한": "长靴选择限制", "자유 선택 제품 중 롱부츠는 최대 1켤레만 선택 가능하다고 사전에 안내한다.": "提前说明：自由选择产品中，长靴最多只能选择1双。", "겨울철 롱부츠 가격을 고려한 제한이며, 인플루언서에게는 재고 사유로 안내하고 있다.": "该限制考虑了冬季长靴价格，对博主则以库存原因为由说明。", "매장 방문·제품 수령": "到店访问及领取产品", "인플루언서는 매장 촬영 및 제품 선택을 마친 후 직원에게 방문확인서를 제시하고 제품을 수령한다.": "博主完成门店拍摄和选鞋后，向店员出示访问确认书并领取产品。", "BF는 참고용으로 활용하며 인플루언서의 개인 스타일을 존중한다. 검수 시 브랜드·제품의 노출 위치, 브랜드명 오기 여부, 주요 소구점 포함 여부 등을 중점적으로 확인한다.": "BF作为参考，尊重博主个人风格。审核重点为品牌及产品曝光位置、品牌名称是否写错、主要卖点是否包含。", "가이드의 구성을 일률적으로 적용하기보다 콘텐츠 흐름을 함께 고려한다.": "结合内容整体流畅度判断，无需统一套用指南结构。", "업로드 기한 안내": "告知上传期限", "매장 방문 후 2주 이내에 업로드하도록 안내한다.": "告知博主在到店访问后2周内上传。", "업로드 지연 관리": "管理上传延迟", "방문 후 2주가 지나도 업로드되지 않은 경우 리마인드한다. 관리 인원이 많아 누락될 수 있으므로 업무 여유가 있을 때 미업로드 건을 일괄 확인하여 연락한다.": "访问后超过2周仍未上传时进行提醒。管理人数较多可能遗漏，有空时统一检查未上传案件并联系。", "위챗 함께 진행한다.": "提供产品，并按协商条件进行20%折扣活动。", "원고료 협업": "稿费合作", "매장 촬영만 진행하거나, 원고료와 함께 20% 할인 이벤트를 진행한다.": "仅进行门店拍摄，或支付稿费并进行20%折扣活动。", "수수료 협업": "佣金合作", "20% 할인 이벤트 사용 실적을 확인하여 협의한 비율로 수수료를 정산한다.": "根据20%折扣活动使用记录，按协商比例结算佣金。", "2. 할인키 생성 기준": "2. 折扣码设置标准", "셀메이트 POS": "Sellmate POS", "셀메이트 POS 열기": "打开Sellmate POS", "할인정책명": "折扣政策名称", "**[협업] 인플루언서ID 20%** 형식으로 생성한다. [협업]을 반드시 포함한다.": "按照 **[협업] 博主ID 20%** 格式创建，必须包含 [협업]。", "할인율·사용 조건": "折扣率与使用条件", "**20% 할인**. 고객이 협업 영상에 좋아요·저장을 누르고 카운터에 제시하면 전 매장에서 적용한다.": "**20%折扣（八折）**。顾客给合作视频点赞、收藏后，向收银台出示，可在全门店使用。", "이벤트 기간": "活动期间", "시작일은 **콘텐츠 업로드일 또는 업로드 후 며칠 이내**로 설정한다. 종료일은 **약 3개월 후 월 말일**로 지정한다. 예: 2026.10.22 ~ 2027.01.31": "开始日设为**内容上传日，或上传后几天内**；结束日设为**约3个月后的月底**。例如：2026.10.22～2027.01.31。", "생성 화면 안내": "创建界面说明", "현재 자료에는 POS 내 생성 메뉴·버튼 순서가 포함되어 있지 않다. 구체적인 화면별 절차는 추후 보완한다.": "现有资料未包含POS创建菜单及按钮顺序，具体界面操作流程待补充。", "3. 협업 기간·비용 시트 기록": "3. 登记合作期间与费用", "관리 시트": "管理表", "[영업기획] 협업 기간/비용": "［营业企划］合作期间／费用", "기본 정보": "基本信息", "노출 국가·지역, 인플루언서ID, 촬영 매장 및 SNS 링크를 기록한다. 업로드 전에는 계정 링크를 작성하고, 업로드 후 콘텐츠 링크를 추가한다.": "记录面向国家或地区、博主ID、拍摄门店及SNS链接。上传前填写账号主页，上传后补充内容链接。", "이벤트 정보": "活动信息", "업로드일·이벤트 시작일·종료일 및 할인정책명을 기록한다. 할인정책명은 POS와 동일하게 작성한다.": "记录上传日、活动开始日、结束日及折扣政策名称；名称须与POS一致。", "원고료·제공 수량·수수료": "稿费、提供数量与佣金", "최종 협의한 원고료와 신발 수량을 기재한다. 수수료 협업 시 협의 비율을 작성하며 **5~15%** 범위에서 조정 가능하다. **3.3%는 현재 CHAAKAN 전액 부담**으로 별도 작성하지 않는다.": "填写最终协商稿费及鞋子数量。如有佣金，填写协商比例，可在 **5～15%** 范围内调整。**3.3%税费目前由CHAAKAN全额承担**，无需另填。", "지급 정보·상신 기록": "支付信息与提报记录", "이체 시 지급매장란에 이체로 작성하고, 시재금 지급 시 해당 매장명을 작성한다. 아마란스 상신일을 기록하고 완료 후 체크박스에 표시한다.": "转账时在支付门店栏填写「이체」，门店备用金支付则填写对应门店。记录Amaranth提报日期，完成后勾选复选框。", "현금 지급 요청": "现金支付请求", "가급적 현금 지급 불가로 안내한다. 불가피하게 진행하는 경우 **매장에 반드시 사전 공유**한다.": "尽量告知无法安排现金支付。如确需进行，**必须提前与门店共享**。", "4. 업로드 후 공유": "4. 上传后内部共享", "공유 채널·대상": "共享频道与对象", "콘텐츠 업로드 및 시트 작성 완료 후 **#오프라인_시딩마케팅**에 공유하고 **@노혜정(프랜차이즈), @안설아(프랜차이즈)**를 멘션한다. 아래 문구의 국가·ID·링크·날짜를 해당 건에 맞게 수정한다.": "内容上传、合作表填写完成后，发至 **#오프라인_시딩마케팅**，并提及 **@노혜정(프랜차이즈)、@안설아(프랜차이즈)**。将下方模板中的国家、ID、链接及日期替换为对应信息。", "5. 비용 지급·자료 정리": "5. 费用支付与资料整理", "원고료 지급 시점": "稿费支付时间", "협의한 콘텐츠 업로드 확인 후 기존 비용 지급 절차에 따라 상신한다.": "确认内容按约定上传后，沿用原费用支付流程提报。", "수수료 정산 시점": "佣金清算时间", "**이벤트 종료 후** 할인키 사용 내역을 확인·전달하고, 기존 서류 기준에 따라 정산 자료를 준비하여 상신한다.": "**活动结束后**确认并转达折扣码使用记录，按现有资料要求准备结算材料并提报。", "송금 자료·폴더명": "汇款资料与文件夹名称", "송금정보·증빙자료·인보이스 요건은 기존 **비용 지급** 절차와 동일하다. 폴더명과 해당 자료의 저장 위치를 확인한다. 기존 폴더명 기준: **계정ID_원고료금액_방문날짜**.": "汇款信息、证明资料及Invoice要求沿用原**费用支付**流程。注意文件夹名称及该资料的存放位置。现有命名标准：**账号ID_稿费金额_访问日期**。", "할인 협업 자료 드라이브": "折扣合作资料云盘", "인플루언서 협업 비용": "博主合作费用", "드라이브 구분": "区分云盘位置", "이 할인 협업 자료에서 안내한 드라이브이다. 기존 원고료 드라이브와 구분하여 해당 건의 자료 위치를 확인한다.": "此处为折扣合作资料所列云盘，与原稿费云盘区分，按对应案件确认存放位置。", "6. 할인키 성과 집계": "6. 折扣码成果统计", "업데이트 일정·성과표": "更新时间与成果表", "매월 **15일 및 말일** 업데이트: [영업기획] 협업/라이브 성과분석": "每月 **15日及月底** 更新：［营业企划］合作／直播成果分析", "① 판매내역 조회": "① 查询销售记录", "셀메이트 POS → **판매 → 판매내역**에서 기간을 선택한다. 이전 집계 종료 시점 다음부터 이번 업데이트 전날 **23:59**까지 확인하여 중복·누락을 방지한다. 최대 내보내기 기간은 **31일**이다.": "进入Sellmate POS → **판매 → 판매내역**，从上次统计截止后的时间查至本次更新前一天 **23:59**，避免重复或遗漏。单次最多导出 **31天**。", "② 엑셀 다운로드·열 정리": "② 下载Excel并整理列", "**검색결과 다운로드 → 새 파일 생성 → xlsx**. 가장 위에 생성된 시트를 연다. **할인유형** 열까지만 남기고, 즉시환급 열에서 **Ctrl + Shift + →**를 눌러 오른쪽 모든 열을 선택·삭제한다.": "点击 **검색결과 다운로드 → 새 파일 생성 → xlsx**，打开最上方生成的工作表。仅保留至 **할인유형** 列；从즉시환급列按 **Ctrl＋Shift＋→**，删除右侧全部列。", "③ 필터·완료 표시": "③ 筛选与完成标记", "데이터 → 필터를 켜고 인플루언서ID별로 확인한다. 집계가 완료된 할인코드는 색상으로 표시한다.": "开启数据筛选，按博主ID检查；统计完成的折扣码用颜色标记。", "④ 취소건·쇼핑백 제외": "④ 排除取消记录与购物袋", "취소내역이 있으면 **취소건과 원 판매내역을 모두 삭제**한 후 집계한다. **쇼핑백 금액은 제외**한다. 미처리 시 할인 전 판매금액이 과대 집계될 수 있다.": "若有取消订单，**同时删除取消记录与对应原销售记录**后再汇总；**排除购物袋金额**，避免折扣前销售金额被高估。", "⑤ 집계 항목": "⑤ 汇总字段", "할인 전 판매금액: **단가 합계**. 할인적용 실판매: **상품별 결제금액 합계**.": "折扣前销售金额：汇总 **단가**；折扣后实际销售金额：汇总 **상품별 결제금액**。", "7. 업로드 공유 문구": "7. 上传后共享话术（韩语）", "8. 이벤트 종료 후 정산 요청 문구": "8. 活动结束后结算请求话术（韩语）", "5개 업무 영역": "5个业务章节", "할인키 생성 순서": "折扣码创建步骤", "로그인 → **프로모션 → 할인율관리 → 등록** → 매장선택: **전매장** → 할인율명: **[협업] 인플루언서ID 20%** → 할인율 (%): **20**": "登录 → **프로모션 → 할인율관리 → 등록** → 매장선택选择 **전매장（全门店）** → 할인율명填写 **[협업] 博主ID 20%** → 할인율 (%)填写 **2 : null}], [{"col": 1, "text": "拾懿 원고료 미정산", "link": null}, {"col": 2, "text": "콘텐츠 업로드는 완료되었으나 수령 계좌 정보를 받지 못해 정산이 보류된 상태이다. 추후 다시 연락하여 계좌 정보를 수집한 후 비용 상신을 진행해야 한다.", "link": null}, {"col": 3, "text": "拾懿 계정: 샤오홍슈 프로필", "link": "https://www.xiaohongshu.com/user/profile/5ff08a27000000000100766c"}], [{"col": 1, "text": "후속 처리 내역 기록", "link": null}, {"col": 2, "text": "추가 연락 및 회신 내용, 업로드 여부, 정산 진행 상황은 기존 관리표에 반영한다.", "link": null}]]}]}, {"brand": "CHAAKAN", "sheets": [{"name": "인플루언서 모집·컨택", "rows": [[{"col": 1, "text": "구분", "link": null}, {"col": 2, "text": "업무 방법 및 기준", "link": null}, {"col": 3, "text": "관련 링크·유의사항", "link": null}], [{"col": 1, "text": "운영 채널", "link": null}, {"col": 2, "text": "인스타그램 및 샤오홍슈를 중심으로 인플루언서를 모집한다.", "link": null}], [{"col": 1, "text": "샤오홍슈 직접 검색", "link": null}, {"col": 2, "text": "패션·코디 관련 키워드를 중심으로 검색한다. 한국에서 인기 있는 브랜드명, 주요 상권명, 한국 여행·쇼핑 관련 키워드도 함께 검색하여 적합한 인플루언서를 찾는다.", "link": null}, {"col": 3, "text": "한국 거주자뿐 아니라 한국 쇼핑 정보 콘텐츠의 성과가 좋은 중국 거주 인플루언서도 검토한다.", "link": null}], [{"col": 1, "text": "샤오홍슈 모집 공고", "link": null}, {"col": 2, "text": "위챗 미니프로그램에 모집 공고를 게시하여 신청자를 모집한다. 공고에는 협업 조건을 간단히 기재하고, 표지에는 인기 제품을 활용하여 신청을 유도한다.", "link": null}, {"col": 3, "text": "직접 검색 대비 신청자는 많으나, 계정 적합도와 콘텐츠 품질의 편차가 있어 개별 검토가 필요하다.", "link": null}], [{"col": 1, "text": "모집 신청 항목", "link": null}, {"col": 2, "text": "샤오홍슈 닉네임, 계정 링크, 위챗 ID를 필수로 수집하며, 그 외 항목은 모집 목적에 따라 추가한다.", "link": null}, {"col": 3, "text": "모집 공고 등록 사이트 — PC 이용 가능, 위챗 로그인 필요", "link": "https://www.baominggongju.com/home"}], [{"col": 1, "text": "인스타그램 자동 DM", "link": null}, {"col": 2, "text": "현재 자동 DM을 통한 모집을 중심으로 운영하며, 직접 검색을 병행한다.", "link": null}], [{"col": 1, "text": "인스타그램 직접 검색", "link": null}, {"col": 2, "text": "패션·데일리룩·신발 코디 관련 키워드와 해시태그로 게시물 및 릴스를 검색한다. 주요 상권·매장의 위치 태그와 관련 브랜드의 태그된 게시물에서도 후보를 찾는다. 적합한 계정을 찾으면 유사 계정 및 함께 태그된 계정도 확인한다.", "link": null}, {"col": 3, "text": "계정의 콘텐츠 유형과 최근 성과를 확인한 뒤 DM으로 협업을 제안한다.", "link": null}], [{"col": 1, "text": "우수 성과 인플루언서 재컨택", "link": null}, {"col": 2, "text": "기존 우수 성과 인플루언서 리스트에서 성과가 좋았던 인플루언서를 선정하여 분기별 재협업을 검토한다.", "link": null}, {"col": 3, "text": "우수 성과 인플루언서 리스트 링크", "link": "https://docs.google.com/spreadsheets/d/1s7eBNe8Widsey7viD8hQ81zRiyNBIbcxbNLUFDQ3n30/edit?usp=sharing"}], [{"col": 1, "text": "계정 유형 선정 기준", "link": null}, {"col": 2, "text": "패션·코디 계정을 우선으로 선정한다. 한국 방문객의 정보 검색 수요를 고려하여 쇼핑 정보 및 여행 계정도 일부 검토한다.", "link": null}, {"col": 3, "text": "팔로워 수보다 계정 유형의 적합도와 실제 콘텐츠 성과를 우선 확인한다.", "link": null}], [{"col": 1, "text": "제품 제공 협업 선정 기준", "link": null}, {"col": 2, "text": "최근 동종 콘텐츠 10~15건의 평균 좋아요 수가 80개 이상인 계정을 우선 검토하며, 가능하면 평균 100개 이상인 계정을 선정한다.", "link": null}, {"col": 3, "text": "서로 다른 유형의 콘텐츠를 섞지 않고, 협업 예정 콘텐츠와 유사한 게시물을 기준으로 확인한다.", "link": null}], [{"col": 1, "text": "유료 협업 비용 협의", "link": null}, {"col": 2, "text": "CPV 5~10원 범위에서 협의하되, 기본적으로 5원 수준을 목표로 한다. 콘텐츠 및 계정의 우수성에 따라 상향 검토한다. 샤오홍슈는 저장당 단가 1,000원 미만, 인스타그램은 저장·공유 합산 건당 단가 약 500원을 목표로 협의한다.", "link": null}, {"col": 3, "text": "샤오홍슈 예상 조회수 = 평균 좋아요 수 × 50. 인스타그램은 실제 조회수를 기준으로 검토한다.", "link": null}], [{"col": 1, "text": "유료 협업 진행 판단", "link": null}, {"col": 2, "text": "위 기준 내에서 협의가 완료되면 진행한다. 기준을 초과하거나 진행 여부를 판단하기 어려운 우수 계정은 대표님께 추가 검토를 요청한다.", "link": null}, {"col": 3, "text": "협업 형식, 제품 제공 수량, 노출 시간 등 최종 협의 조건을 함께 전달한다.", "link": null}], [{"col": 1, "text": "협업 확정 후 정산 자료 안내", "link": null}, {"col": 2, "text": "유료 협업 확정 시 수령 계좌 국가를 확인하고, 필요한 정산 자료를 미리 안내하여 준비하도록 요청한다.", "link": null}, {"col": 3, "text": "자료 누락이나 계좌 정보 오류로 인한 지급 지연을 방지하기 위해 사전에 안내한다.", "link": null}], [{"col": 1, "text": "한국 계좌 수령 시", "link": null}, {"col": 2, "text": "외국인등록증 사진, 통장 사본, 수취인 및 계좌 정보를 요청한다.", "link": null}, {"col": 3, "text": "상세 제출 및 지급 절차는 ‘비용 지급’ 시트 참고", "link": null}], [{"col": 1, "text": "해외 계좌 수령 시", "link": null}, {"col": 2, "text": "아래 해외 송금 정보 및 증빙자료를 요청한다.", "link": null}, {"col": 3, "text": "상세 제출 및 지급 절차는 ‘비용 지급’ 시트 참고", "link": null}], [{"col": 1, "text": "방문 예약 진행", "link": null}, {"col": 2, "text": "협업 조건을 최종 확인한 후 방문 예약 절차를 진행한다 l": 1, "text": "방문 예약·확인서 발급", "link": null}, {"col": 2, "text": "특별히 긴급한 경우를 제외하고 최소 방문 하루 전까지 예약하도록 안내한다. 일정 확정 후 캘린더에 기록하고 인플루언서에게 방문확인서를 발급한다.", "link": null}], [{"col": 1, "text": "기본 제품 제공 조건", "link": null}, {"col": 2, "text": "기본적으로 총 2켤레를 제공하며, 지정 제품 1켤레와 자유 선택 제품 1켤레로 구성한다.", "link": null}], [{"col": 1, "text": "제품 제공 조건 조정", "link": null}, {"col": 2, "text": "유료 협업 비용 협의 시 자유 선택 2켤레 또는 3켤레 제공 조건으로 조정하여 협의할 수 있다. 기존 방문자 중 콘텐츠 성과가 우수했던 인플루언서는 자유 선택 2켤레로 조정하기도 한다.", "link": null}, {"col": 3, "text": "최종 협의한 제공 조건을 방문확인서에 정확히 반영한다.", "link": null}], [{"col": 1, "text": "롱부츠 선택 제한", "link": null}, {"col": 2, "text": "자유 선택 제품 중 롱부츠는 최대 1켤레만 선택 가능하다고 사전에 안내한다.", "link": null}, {"col": 3, "text": "겨울철 롱부츠 가격을 고려한 제한이며, 인플루언서에게는 재고 사유로 안내하고 있다.", "link": null}], [{"col": 1, "text": "매장 방문·제품 수령", "link": null}, {"col": 2, "text": "인플루언서는 매장 촬영 및 제품 선택을 마친 후 직원에게 방문확인서를 제시하고 제품을 수령한다.", "link": null}], [{"col": 1, "text": "콘텐츠 검수", "link": null}, {"col": 2, "text": "BF는 참고용으로 활용하며 인플루언서의 개인 스타일을 존중한다. 검수 시 브랜드·제품의 노출 위치, 브랜드명 오기 여부, 주요 소구점 포함 여부 등을 중점적으로 확인한다.", "link": null}, {"col": 3, "text": "가이드의 구성을 일률적으로 적용하기보다 콘텐츠 흐름을 함께 고려한다.", "link": null}], [{"col": 1, "text": "업로드 기한 안내", "link": null}, {"col": 2, "text": "매장 방문 후 2주 이내에 업로드하도록 안내한다.", "link": null}], [{"col": 1, "text": "업로드 지연 관리", "link": null}, {"col": 2, "text": "방문 후 2주가 지나도 업로드되지 않은 경우 리마인드한다. 관리 인원이 많아 누락될 수 있으므로 업무 여유가 있을 때 미업로드 건을 일괄 확인하여 연락한다.", "link": null}, {"col": 3, "text": "위챗 연락처는 인플루언서 리스트의 비고란 참고. 인스타그램은 DM으로 연락한다.", "link": null}], [{"col": 1, "text": "업로드 후 성과 관리", "link": null}, {"col": 2, "text": "업로드 후 성과가 저조한 경우 인플루언서에게 노출 제한이나 플랫폼 규정 위반 안내 여부 등을 확인한다.", "link": null}, {"col": 3, "text": "협조적인 경우 콘텐츠 수정 후 재업로드하거나 자체적으로 유료 홍보를 진행하기도 한다. 다만 회신이 없거나 후속 조치가 어려운 경우도 있어 개별 확인이 필요하다.", "link": null}], [{"col": 1, "text": "BF(가이드라인) 링크", "link": null}], [{"col": 1, "text": "매장·콘텐츠 형식에 맞는 가이드를 선택하여 전달하며, 추후 운영 필요에 따라 내용을 수정하여 사용한다.", "link": null}], [{"col": 1, "text": "구분", "link": null}, {"col": 2, "text": "링크", "link": null}], [{"col": 1, "text": "홍대점 CN ", "link": null}, {"col": 2, "text": "https://canva.link/8aocku6sm07xxr1", "link": "https://canva.link/8aocku6sm07xxr1"}], [{"col": 1, "text": "성수점 CN", "link": null}, {"col": 2, "text": "https://canva.link/3bd4fkysw1v45bq", "link": "https://canva.link/3bd4fkysw1v45bq"}], [{"col": 1, "text": "명동점 CN ", "link": null}, {"col": 2, "text": "https://canva.link/srx5eel92ujkn55", "link": "https://canva.link/srx5eel92ujkn55"}], [{"col": 1, "text": "홍대점 TW", "link": null}, {"col": 2, "text": "https://canva.link/azu97a5dfdkja8o", "link": "https://canva.link/azu97a5dfdkja8o"}], [{"col": 1, "text": "성수점 TW", "link": null}, {"col": 2, "text": "https://canva.link/up8y2o9q0dywjit", "link": "https://canva.link/up8y2o9q0dywjit"}], [{"col": 1, "text": "명동점 TW", "link": null}, {"col": 2, "text": "https://canva.link/v3ofcpjhffhwf6g", "link": "https://canva.link/v3ofcpjhffhwf6g"}], [{"col": 1, "text": "“Idol同款” CN", "link": null}, {"col": 2, "text": "https://canva.link/qypf4cvriqzifsf", "link": "https://canva.link/qypf4cvriqzifsf"}]]}, {"name": "20% 할인 협업·할인키 관리", "rows": [[{"col": 1, "text": "1. 협업 유형", "link": null}], [{"col": 1, "text": "제품 제공 협업", "link": null}, {"col": 2, "text": "제품을 제공하며, 협의 조건에 따라 20% 할인 이벤트를 함께 진행한다.", "link": null}], [{"col": 1, "text": "원고료 협업", "link": null}, {"col": 2, "text": "매장 촬영만 진행하거나, 원고료와 함께 20% 할인 이벤트를 진행한다.", "link": null}], [{"col": 1, "text": "수수료 협업", "link": null}, {"col": 2, "text": "20% 할인 이벤트 사용 실적을 확인하여 협의한 비율로 수수료를 정산한다.", "link": null}], [{"col": 1, "text": "2. 할인키 생성 기준", "link": null}], [{"col": 1, "text": "셀메이트 POS", "link": null}, {"col": 2, "text": "셀메이트 POS 열기", "link": "https://sellmatepos.com/#/"}], [{"col": 1, "text": "할인정책명", "link": null}, {"col": 2, "text": "**[협업] 인플루언서ID 20%** 형식으로 생성한다. [협업]을 반드시 포함한다.", "link": null}], [{"col": 1, "text": "할인율·사용 조건", "link": null}, {"col": 2, "text": "**20% 할인**. 고객이 협업 영상에 좋아요·저장을 누르고 카운터에 제시하면 전 매장에서 적용한다.", "link": null}], [{"col": 1, "text": "이벤트 기간", "link": null}, {"col": 2, "text": "시작일은 **콘텐츠 업로드일 또는 업로드 후 며칠 이내**로 설정한다. 종료일은 **약 3개월 후 월 말일**로 지정한다. 예: 2026.10.22 ~ 2027.01.31", "link": null}], [{"col": 1, "text": "할인키 생성 순서", "link": null}, {"col": 2, "text": "로그인 → **프로모션 → 할인율관리 → 등록** → 매장선택: **전매장** → 할인율명: **[협업] 인플루언서ID 20%** → 할인율 (%): **20**", "link": null}], [{"col": 1, "text": "할인키 순서·종료 관리", "link": null}, {"col": 2, "text": "새로 생성한 할인키는 보통 목록 **맨 아래**에 표시된다. 순서를 하나씩 수동 변경하여 앞쪽으로 이동한다. 종료된 할인키는 삭제하되, **수수료 유무에 따른 공유·정산 절차를 먼저 진행**한다.", "link": null}], [{"col": 1, "text": "3. 협업 기간·비용 시트 기록", "link": null}], [{"col": 1, "text": "관리 시트", "link": null}, {"col": 2, "text": "[영업기획] 협업 기간/비용", "link": "https://docs.google.com/spreadsheets/d/1m0niwV9ar62tZYtbHFaP7G4kM7r3_Zb1suXtPAPB25c/edit?gid=0#gid=0"}], [{"col": 1, "text": "기본 정보", "link": null}, {"col": 2, "text": "노출 국가·지역, 인플루언서ID, 촬영 매장 및 SNS 링크를 기록한다. 업로드 전에는 계정 링크를 작성하고, 업로드 후 콘텐츠 링크를 추가한다.", "link": null}], [{"col": 1, "text": "이벤트 정보", "link": null}, {"col": 2, "text": "업로드일·이벤트 시작일·종료일 및 할인정책명을 기록한다. 할인정책명은 POS와 동일하게 작성한다.", "link": null}], [{"col": 1, "text": "원고료·제공 수량·수수료", "link": null}, {"col": 2, "text": "최종 협의한 원고료와 신발 수량을 기재한다. 수수료는 일반적으로 판매 실적의 **5% 또는 10%**이며, 협의한 비율을 기록한다. **3.3%는 현재 CHAAKAN 전액 부담**으로 별도 작성하지 않는다.", "link": null}], [{"col": 1, "text": "지급 정보·상신 기록", "link": null}, {"col": 2, "text": "이체 시 지급매장란에 이체로 작성하고, 시재금 지급 시 해당 매장명을 작성한다. 아마란스 상신일을 기록하고 완료 후 체크박스에 표시한다.", "link": null}], [{"col": 1, "text": "현금 지급 요청", "link": null}, {"col": 2, "text": "가급적 현금 지급 불가로 안내한다. 불가피하게 진행하는 경우 **매장에 반드시 사전 공유**한다.", "link": null}], [{"col": 1, "text": "4. 업로드 후 공유", "link": null}], [{"col": 1, "text": "공유 채널·대상", "link": null}, {"col": 2, "text": "콘텐츠 업로드 및 시트 작성 완료 후 **#오프라인_시딩마케팅**에 공유하고 **@노혜정(프랜차이즈), @안설아(프랜차이즈)**를 멘션한다. 아래 문구의 국가·ID·링크·날짜를 해당 건에 맞게 수정한다.", "link": null}], [{"col": 1, "text": "5. 비용 지급·자료 정리", "link": null}], [{"col": 1, "text": "원고료 지급 시점", "link": null}, {"col": 2, "text": "협의한 콘텐츠 업로드 확인 후 기존 비용 지급 절차에 따라 상신한다.", "link": null}], [{"col": 1, "text": "수수료 정산 시점", "link": null}, {"col": 2, "text": "수수료 협업은 **이벤트 종료 처리·할인키 삭제 전에 판매 실적을 확인하고 정산을 먼저 진행**한다. **#오프라인_시딩마케팅**에 정산을 요청한 후, 정산 완료 시 인플루언서에게 **예상 지급 금액**을 안내한다.", "link": null}], [{"col": 1, "text": "송금 자료·폴더명", "link": null}, {"col": 2, "text": "송금정보·증빙자료·인보이스 요건은 기존 **비용 지급** 절차와 동일하다. 폴더명과 해당 자료의 저장 위치를 확인한다. 기존 폴더명 기준: **계정ID_원고료금액_방문날짜**.", "link": null}], [{"col": 1, "text": "할인 협업 자료 드라이브", "link": null}, {"col": 2, "text": "인플루언서 협업 비용", "link": "https://drive.google.com/drive/u/0/folders/1fp2wEIu_uxepPVOxjqU_rJX052SM_wOQ"}], [{"col": 1, "text": "드라이브 구분", "link": null}, {"col": 2, "text": "이 할인 협업 자료에서 안내한 드라이브이다. 기존 원고료 드라이브와 구분하여 해당 건의 자료 위치를 확인한다.", "link": null}], [{"col": 1, "text": "6. 할인키 성과 집계", "link": null}], [{"col": 1, "text": "업데이트 일정·성과표", "link": null}, {"col": 2, "text": "매월 **15일 및 말일** 업데이트: [영업기획] 협업/라이브 성과분석", "link": "https://docs.google.com/spreadsheets/d/1Cq5DQxa6nOc0wTt41w3cFyQJNf-P-GhdppvDwXVrjmY/edit?gid=1688180022#gid=1688180022"}], [{"col": 1, "text": "① 판매내역 조회", "link": null}, {"col": 2, "text": "셀메이트 POS → **판매 → 판매내역**에서 기간을 선택한다. 이전 집계 종료 시점 다음부터 이번 업데이트 전날 **23:59**까지 확인하여 중복·누락을 방지한다. 최대 내보내기 기간은 **31일**이다.", "link": null}], [{"col": 1, "text": "② 엑셀 다운로드·열 정리", "link": null}, {"col": 2, "text": "**검색결과 다운로드 → 새 파일 생성 → xlsx**. 가장 위에 생성된 시트를 연다. **할인유형** 열까지만 남기고, 즉시환급 열에서 **Ctrl + Shift + →**를 눌러 오른쪽 모든 열을 선택·삭제한다.", "link": null}], [{"col": 1, "text": "③ 필터·완료 표시", "link": null}, {"col": 2, "text": "데이터 → 필터를 켜고 인플루언서ID별로 확인한다. 집계가 완료된 할인코드는 색상으로 표시한다.", "link": null}], [{"col": 1, "text": "④ 취소건·쇼핑백 제외", "link": null}, {"col": 2, "text": "취소내역이 있으면 **취소건과 원 판매내역을 모두 삭제**한 후 집계한다. **쇼핑백 금액은 제외**한다. 미처리 시 할인 전 판매금액이 과대 집계될 수 있다.", "link": null}], [{"col": 1, "text": "⑤ 집계 항목", "link": null}, {"col": 2, "text": "할인 전 판매금액: **단가 합계**. 할인적용 실판매: **상품별 결제금액 합계**.", "link": null}], [{"col": 1, "text": "7. 업로드 공유 문구", "link": null}], [{"col": 1, "text": "@노혜정(프랜차이즈) @안설아(프랜차이즈)\n[인플루언서 20% 협업]\n\n안녕하세요. (국가) 인플루언서 협업 관련 내용 공유드립니다!\n\n1. 아이디: 인플루언서 ID\nSNS 링크: \n업로드 링크: \n이벤트 기간: YYYY.MM.DD ~ YYYY.MM.DD\n20% 할인키: [협업] 인플루언서 ID 20%\n\n영상에 좋아요와 저장 누르고 카운터에 보여주시면, 전 매장에서 20% 할인 적용됩니다!\n전 매장 공지 부탁드립니다 :)\n\n[영업기획] 협업 기간/비용 시트 작성 완료하였습니다 🙂\nhttps://docs.google.com/spreadsheets/d/1m0niwV9ar62tZYtbHFaP7G4kM7r3_Zb1suXtPAPB25c/edit?gid=0#gid=0", "link": null}], [{"col": 1, "text": "8. 이벤트 종료·정산 안내", "link": null}], [{"col": 1, "text": "수수료 없는 협업: 할인키 삭제 전에 아래 문구를 #오프라인_시딩마케팅에 공유한다.\n\n@이광호(영업기획_팀장) @인윤정(일문몰)\nYYYY년 MM월 DD일 삭제 예정: 00건\n[협업] iamchuuu0222 20%\n.....\n[협업] minann22 20%\n수수료 정산: 0건\n\n────────────────\n수수료 있는 협업: 삭제·종료 처리 전에 판매 실적을 확인하고, 아래 문구로 #오프라인_시딩마케팅에 정산을 요청한다.\n\n@franchise-team @김인아(영업기획_파트장) @안설아(프랜차이즈)\n안녕하세요. 00 인플루언서 협업 이벤트가 종료되어 정산 요청드립니다!\nSNS 링크:\n이벤트 기간:\n20% 할인키명:\n\n확인 부탁드립니다. 감사합니다.\n\n정산 완료 후 인플루언서에게 예상 지급 금액을 안내한다.", "link": null}]]}, {"name": "비용 지급", "rows": [[{"col": 1, "text": "1. 상신 대상·시점", "link": null}], [{"col": 1, "text": "구분", "link": null}, {"col": 2, "text": "내용", "link": null}], [{"col": 1, "text": "상신 대상", "link": null}, {"col": 2, "text": "샤오홍슈·인스타그램 유료 인플루언서 협업에 따른 원고료 및 수수료", "link": null}], [{"col": 1, "text": "상신 시점", "link": null}, {"col": 2, "text": "협의한 조건에 따라 콘텐츠가 업로드된 것을 확인한 후 상신한다.", "link": null}], [{"col": 1, "text": "지급 일정 안내", "link": null}, {"col": 2, "text": "비용 상신 후 이번 주 또는 다음 주 목요일에 일괄 지급될 예정이라고 인플루언서에게 안내한다.", "link": null}], [{"col": 1, "text": "2. 정산 정보·서류 수집", "link": null}], [{"col": 1, "text": "수령 계좌", "link": null}, {"col": 2, "text": "수집 정보 및 서류", "link": null}], [{"col": 1, "text": "한국 계좌", "link": null}, {"col": 2, "text": "이름, 은행명, 계좌번호, 통장 사본, 외국인등록증 사진", "link": null}], [{"col": 1, "text": "해외 계좌", "link": null}, {"col": 2, "text": "영문 이름, 은행 영문명, 은행코드, 지점코드, 계좌번호, SWIFT 코드, 영문 주소, 우편번호, 인보이스 서명, 신분증 앞·뒷면 또는 여권 사본", "link": null}], [{"col": 1, "text": "수집한 정보로 청구서 또는 인보이스를 작성하여 인플루언서에게 전달하고, 서명본을 회수한다.", "link": null}], [{"col": 1, "text": "3. 드라이브 자료 정리", "link": null}], [{"col": 1, "text": "드라이브 **「명동성수점 원고료 및 수수료」**에 인플루언서별 개별 폴더를 생성하고 아래 자료를 업로드한다.", "link": null}], [{"col": 1, "text": "구분", "link": null}, {"col": 2, "text": "내용", "link": null}], [{"col": 1, "text": "폴더명", "link": null}, {"col": 2, "text": "계정ID_원고료금액_방문날짜", "link": null}], [{"col": 1, "text": "업로드 자료", "link": null}, {"col": 2, "text": "협업 소통 캡처, 송금정보 텍스트, 업로드 콘텐츠 캡처, 여권·신분증 사진, 통장·은행카드 등 계좌 증빙자료, 청구서·인보이스 서명본", "link": null}], [{"col": 1, "text": "드라이브 링크", "link": null}, {"col": 2, "text": "명동성수점 원고료 및 수수료", "link": "https://drive.google.com/drive/folders/1gLnLP0XRd3V_iC7AJYrhWfnuYyguwpvM"}], [{"col": 1, "text": "4. 아마란스 지출결의서 작성", "link": null}], [{"col": 1, "text": "아마란스 접속", "link": "https://erp.chaakan.co.kr/"}], [{"col": 1, "text": "임직원업무관리 → 지출결의/계산서 → +품의/지출결의 → 지출결의서작성 → 신규작성", "link": null}], [{"col": 1, "text": "입력 항목", "link": null}, {"col": 2, "text": "작성 방법", "link": null}], [{"col": 1, "text": "제목 — 원고료", "link": null}, {"col": 2, "text": "2026.09_영업기획_시딩 마케팅 원고료_인플루언서 아이디", "link": null}], [{"col": 1, "text": "제목 — 수수료", "link": null}, {"col": 2, "text": "2026.09_영업기획_시딩 마케팅 수수료_인플루언서 아이디", "link": null}], [{"col": 1, "text": "제목 작성 시 유의사항", "link": null}, {"col": 2, "text": "위 예시의 연월과 인플루언서 아이디를 해당 건에 맞게 변경한다.", "link": null}], [{"col": 1, "text": "내용", "link": null}, {"col": 2, "text": "제목과 동일하게 복사하여 입력", "link": null}], [{"col": 1, "text": "용도", "link": null}, {"col": 2, "text": "(판관)광고선전비_오프라인", "link": null}], [{"col": 1, "text": "거래처", "link": null}, {"col": 2, "text": "00186 오프라인 인플루언서_해외", "link": null}], [{"col": 1, "text": "사용부서", "link": null}, {"col": 2, "text": "방문 매장에 따라 명동점 / 성수점 / 홍대점 선택", "link": null}], [{"col": 1, "text": "부가세", "link": null}, {"col": 2, "text": "0원 입력", "link": null}], [{"col": 1, "text": "증빙", "link": null}, {"col": 2, "text": "청구서 선택. 인보이스(Invoice)도 청구서에 해당", "link": null}], [{"col": 1, "text": "회계처리일자·증빙일자", "link": null}, {"col": 2, "text": "회계처리일자(회계일자) = 증빙일자(거래
